name: Update TryHackMe Complete Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fetch and update README
        run: |
          python -c "
import requests, json, re

username = 'penyihirgamingmajo'

# Ambil data rank
rank_resp = requests.get(f'https://tryhackme.com/api/user/rank/{username}')
if rank_resp.status_code != 200:
    print('Gagal mengambil rank')
    exit(1)
rank_data = rank_resp.json()

# Ambil data badges (opsional)
badge_resp = requests.get(f'https://tryhackme.com/api/user/badges/{username}')
badges = badge_resp.json() if badge_resp.status_code == 200 else []

# Tentukan title berdasarkan poin (contoh mapping sederhana)
points = rank_data.get('points', 0)
if points >= 50000:
    title = 'TITAN'
elif points >= 4000:
    title = 'Mage'
elif points >= 2000:
    title = 'Voyager'
else:
    title = rank_data.get('title', 'Neophyte')

stats = f'''
### 🏆 TryHackMe Stats
- **Title**: {title}
- **Level**: {rank_data.get('level', 'N/A')}
- **Points**: {points}
- **Rank**: #{rank_data.get('rank', 'N/A')}
- **Rooms Completed**: {rank_data.get('rooms_completed', 0)}
'''

# Baca README.md
with open('README.md', 'r') as f:
    content = f.read()

# Ganti bagian antara marker
pattern = r'<!-- THM-STATS-START -->.*?<!-- THM-STATS-END -->'
replacement = f'<!-- THM-STATS-START -->\n{stats}\n<!-- THM-STATS-END -->'
new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

with open('README.md', 'w') as f:
    f.write(new_content)

print('README updated')
"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update THM stats [skip ci]"
          git push
